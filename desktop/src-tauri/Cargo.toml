[package]
name = "desktop"
description = "Warlay desktop client"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# The crate/package stays "desktop" (so `cargo build -p desktop` and the
# workspace member path keep working unchanged) -- only the produced binary
# is renamed, to "warlay.exe".
[[bin]]
name = "warlay"
path = "src/main.rs"

[features]
# Without this, tauri::generate_context!() has no feature to check and
# `dev` in tauri-macros' ContextData always evaluates true (cfg!(feature =
# "custom-protocol") silently reads as false for an undeclared feature) --
# every build, including the real NSIS installer, then embeds the dev-server
# URL (http://localhost:1420) instead of the bundled dist/ assets, and the
# shipped app loads a dead page since nothing serves that port outside
# `npm run dev`. The Tauri CLI passes --features custom-protocol on `tauri
# build`; this is what gives it something to enable. DO NOT REMOVE.
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
warlay = { workspace = true, features = ["transport", "core", "protocol", "crypto"] }
anyhow = { workspace = true }
if-addrs = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-appender = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }

# Tauri
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"

# Voice chat
audiopus = "0.2"
cpal = "0.15"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Security_Cryptography", "Win32_Foundation", "Win32_Networking_WinSock", "Win32_System_IO", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_System_Registry", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_System_SystemInformation", "Win32_System_Diagnostics_ToolHelp", "Win32_Graphics_Gdi", "Win32_System_JobObjects", "Win32_Security", "Win32_System_Threading"] }

[package]
name = "daemon"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

# The crate/package stays "daemon" (so `cargo build -p daemon` and the
# workspace member path keep working unchanged) -- only the produced binary
# is renamed, to "wnetd.exe" (Warlay Network Daemon).
[[bin]]
name = "wnetd"
path = "src/main.rs"

[dependencies]
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
time = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
rusqlite = { workspace = true }
warlay = { workspace = true, features = ["protocol", "engine"] }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true }

[target.'cfg(windows)'.build-dependencies]
tauri-winres = "0.3"

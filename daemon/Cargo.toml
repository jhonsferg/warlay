[package]
name = "daemon"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

# The crate/package stays "daemon" (so `cargo build -p daemon` and the
# workspace member path keep working unchanged) -- only the produced binary
# is renamed, to "wnetd.exe" (Warlay Network Daemon).
#
# Everything the daemon *does* lives in `crates/agent`; this package is the
# standalone binary around it, kept so the agent can still be built, run and
# tested on its own. warlay.exe --daemon embeds that same crate, so there is
# no second implementation to keep in sync.
[[bin]]
name = "wnetd"
path = "src/main.rs"
# `test = false`: this thin wrapper has no tests of its own (they live in
# `crates/agent`), and its test harness inherits the elevation manifest from
# build.rs, which made `cargo test -p daemon` fail with
# ERROR_ELEVATION_REQUIRED (740) from any non-elevated shell.
test = false

[dependencies]
warlay-agent = { workspace = true }

# build.rs embeds the icon, version info and the `requireAdministrator`
# manifest into wnetd.exe. The manifest stays here, on the *binary* package:
# a build script affects every target of its own package (including its test
# binaries, which is what used to force `cargo test -p daemon` to run from an
# elevated shell) and must never leak into the library or into warlay.exe.
[target.'cfg(windows)'.build-dependencies]
tauri-winres = "0.3"

[workspace]
resolver = "2"
members = [
    "crates/*",
    "server",
    "daemon",
    "desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Warlay contributors"]
license = "MIT"
repository = "https://github.com/jhonsferg/warlay"

[workspace.dependencies]
# Internal crates
warlay = { path = "crates/warlay" }
warlay-config = { path = "crates/config", package = "config" }
warlay-core = { path = "crates/core", package = "core" }
warlay-crypto = { path = "crates/crypto", package = "crypto" }
warlay-engine = { path = "crates/engine", package = "engine" }
warlay-matchmaking = { path = "crates/matchmaking", package = "matchmaking" }
warlay-protocol = { path = "crates/protocol", package = "protocol" }
warlay-storage = { path = "crates/storage", package = "storage" }
warlay-transport = { path = "crates/transport", package = "transport" }

# Async runtime and networking
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "signal", "time", "sync", "io-util", "process"] }
futures-util = "0.3"
socket2 = { version = "0.5", features = ["all"] }
if-addrs = "0.13"
url = "2.5"
axum = { version = "0.8", features = ["ws"] }
tokio-tungstenite = "0.24"
quinn = "0.11"
etherparse = "0.15"

# TLS
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
webpki-roots = "1"
rcgen = "0.13"

# Cryptography
x25519-dalek = { version = "2", features = ["static_secrets"] }
chacha20poly1305 = "0.10"
hkdf = "0.12"
sha2 = "0.10"
hmac = "0.12"
rand_core = { version = "0.6", features = ["getrandom"] }
constant_time_eq = "0.3"

# Serialization and storage
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3"
toml = "0.8"
base64 = "0.23"
uuid = { version = "1", features = ["v4", "serde"] }
rusqlite = { version = "0.31", features = ["bundled"] }

# Errors, CLI and observability
anyhow = "1"
thiserror = "1"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
time = "0.3"

# Platform
windows = { version = "0.59", features = ["Win32_Networking_WinSock", "Win32_Foundation", "Win32_System_IO", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Pipes", "Win32_System_Threading"] }

[profile.release]
codegen-units = 1
lto = true
strip = true

# The desktop client favors a small installer over raw throughput.
[profile.release.package.desktop]
opt-level = "s"

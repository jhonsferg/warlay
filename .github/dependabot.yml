version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
    groups:
      cargo-minor:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /desktop
    schedule:
      interval: weekly
    commit-message:
      prefix: build
    groups:
      npm-minor:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci

  - package-ecosystem: docker
    directory: /server
    schedule:
      interval: weekly
    commit-message:
      prefix: build

version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    ignore:
      # Must stay on the version Tauri uses (desktop links both); upgraded
      # together with Tauri by hand.
      - dependency-name: windows
      # bincode 3.0.0 is a tombstone: its maintainers ended the project and
      # published a release that deliberately fails to compile
      # (https://xkcd.com/2347/). Stay on 1.x.
      - dependency-name: bincode
        update-types: ["version-update:semver-major"]
    groups:
      cargo-minor:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /desktop
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    ignore:
      # vue-tsc still relies on the TypeScript 5 compiler API; the native
      # TypeScript 7 compiler does not expose it yet.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    groups:
      npm-minor:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore

  - package-ecosystem: docker
    directory: /server
    schedule:
      interval: weekly
    commit-message:
      prefix: chore

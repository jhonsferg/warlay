name: Release

# Every merge into the protected `main` branch publishes a new version:
#   1. compute the next semantic version from Conventional Commits since the
#      last `v*` tag (feat -> minor, breaking -> major, anything else -> patch),
#   2. build the server for Linux/macOS/Windows and the desktop client for
#      Windows (one executable, warlay.exe), stamping that
#      version into every manifest,
#   3. push the server image to GHCR,
#   4. tag the commit and publish a GitHub Release with notes and checksums.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Next version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.next.outputs.version }}
      skip: ${{ steps.next.outputs.skip }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Compute next version
        id: next
        run: |
          set -euo pipefail
          last_tag=$(git tag --list 'v[0-9]*' --sort=-v:refname | head -n1)

          if [ -z "$last_tag" ]; then
            version=$(sed -n '/^\[workspace\.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml | tr -d '\r')
            echo "No previous release, starting at the workspace version $version."
          else
            if [ -z "$(git rev-list "$last_tag..HEAD")" ]; then
              echo "Nothing new since $last_tag, skipping."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            log=$(git log --format='%s%n%b' "$last_tag..HEAD")
            IFS=. read -r major minor patch <<< "${last_tag#v}"
            if grep -Eq '^[a-z]+(\([^)]*\))?!:|^BREAKING[ -]CHANGE:' <<< "$log"; then
              # Pre-1.0, breaking changes bump the minor version (SemVer 0.x).
              if [ "$major" -eq 0 ]; then minor=$((minor + 1)); else major=$((major + 1)); minor=0; fi
              patch=0
            elif grep -Eq '^feat(\([^)]*\))?:' <<< "$log"; then
              minor=$((minor + 1)); patch=0
            else
              patch=$((patch + 1))
            fi
            version="$major.$minor.$patch"
            echo "Bumping $last_tag -> v$version."
          fi

          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "::error::Tag v$version already exists."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

  server:
    name: Server (${{ matrix.target }})
    needs: version
    if: needs.version.outputs.skip != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          # musl builds are fully static: they run on any Linux distribution.
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest, cross: true }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-latest, cross: true }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/set-version
        with:
          version: ${{ env.VERSION }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install cross
        if: matrix.cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross
      - name: Build
        shell: bash
        run: |
          builder=cargo
          if [ "${{ matrix.cross }}" = "true" ]; then builder=cross; fi
          $builder build --release -p server --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          target=${{ matrix.target }}
          ext=""; [[ "$target" == *windows* ]] && ext=".exe"
          name="warlay-server-v${VERSION}-${target}"

          mkdir -p "dist/$name/config"
          cp "target/$target/release/warlay-server$ext" "dist/$name/"
          cp server/config/*.toml "dist/$name/config/"
          cp LICENSE "dist/$name/"
          cp server/README.md "dist/$name/README.md"

          cd dist
          if [[ "$target" == *windows* ]]; then
            7z a -tzip "$name.zip" "$name" > /dev/null
          else
            tar -czf "$name.tar.gz" "$name"
          fi
          rm -rf "$name"
      - uses: actions/upload-artifact@v7
        with:
          name: server-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  desktop:
    name: Desktop client (Windows x64)
    needs: version
    if: needs.version.outputs.skip != 'true'
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install frontend dependencies
        working-directory: desktop
        run: npm ci
      # After `npm ci`, so package.json still matches the lockfile while installing.
      - uses: ./.github/actions/set-version
        with:
          version: ${{ env.VERSION }}
      # The server address is not in the source: it is injected at build time
      # from the WARLAY_MAIN_URL repository secret. A fork sets its own.
      - name: Require the server URL secret
        shell: bash
        env:
          WARLAY_MAIN_URL: ${{ secrets.WARLAY_MAIN_URL }}
        run: |
          if [ -z "$WARLAY_MAIN_URL" ]; then
            echo "::error::Create the WARLAY_MAIN_URL repository secret (the address of your Warlay server, e.g. https://warlay.example.com) so releases know which server the client talks to."
            exit 1
          fi
      - name: Build client and installer
        # beforeBuildCommand runs `npm run build`, which reads the variable.
        working-directory: desktop
        shell: bash
        env:
          VITE_WARLAY_MAIN_URL: ${{ secrets.WARLAY_MAIN_URL }}
        # Tauri downloads its NSIS installer tools from GitHub with no retry, and
        # those downloads sometimes answer 504 for hours. A failed attempt only
        # repeats the bundling (the compiled app is reused, and a half-extracted
        # NSIS folder is recreated), so trying again is cheap.
        run: |
          for attempt in 1 2 3 4 5 6; do
            if npx tauri build; then exit 0; fi
            echo "::warning::tauri build failed (attempt $attempt of 6), retrying"
            sleep $((attempt * 20))
          done
          exit 1
      - name: Build portable zip
        working-directory: desktop
        run: npm run build-portable-zip
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          bundle=target/release/bundle/nsis
          mkdir -p dist
          cp "$bundle/Warlay_${VERSION}_x64-setup.exe" "dist/warlay-desktop-v${VERSION}-windows-x64-setup.exe"
          cp "$bundle/Warlay_${VERSION}_x64-portable.zip" "dist/warlay-desktop-v${VERSION}-windows-x64-portable.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-windows-x64
          path: dist/*
          if-no-files-found: error

  docker:
    name: Server image (${{ matrix.target }})
    needs: version
    if: needs.version.outputs.skip != 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # One image per Dockerfile stage. `warlay-server` keeps the legacy
          # all-in-one hub under its original name.
          - { target: main, image: warlay-main }
          - { target: helper, image: warlay-helper }
          - { target: hub, image: warlay-server }
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/set-version
        with:
          version: ${{ env.VERSION }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=${{ env.VERSION }}
            type=raw,value=latest
      - uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          file: server/Dockerfile
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}

  release:
    name: Publish release
    needs: [version, server, desktop, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Download only our own artifacts: other jobs' actions can upload
      # extra ones (e.g. Docker build records) that are not release assets.
      - uses: actions/download-artifact@v8
        with:
          pattern: server-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          pattern: desktop-*
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum -- * > SHA256SUMS.txt
      - name: Generate changelog
        uses: orhun/git-cliff-action@v4
        with:
          config: .github/cliff.toml
          args: --unreleased --tag v${{ env.VERSION }} --strip header
        env:
          OUTPUT: CHANGES.md
      - name: Compose release notes
        env:
          IMAGE_OWNER: ghcr.io/${{ github.repository_owner }}
        run: |
          owner=$(echo "$IMAGE_OWNER" | tr '[:upper:]' '[:lower:]')
          {
            echo "## Downloads"
            echo
            echo "| Component | Platform | File |"
            echo "|-----------|----------|------|"
            echo "| Desktop client (installer) | Windows x64 | \`warlay-desktop-v${VERSION}-windows-x64-setup.exe\` |"
            echo "| Desktop client (portable) | Windows x64 | \`warlay-desktop-v${VERSION}-windows-x64-portable.zip\` |"
            echo "| Server | Linux x64 / ARM64 (static) | \`warlay-server-v${VERSION}-{x86_64,aarch64}-unknown-linux-musl.tar.gz\` |"
            echo "| Server | macOS Intel / Apple Silicon | \`warlay-server-v${VERSION}-{x86_64,aarch64}-apple-darwin.tar.gz\` |"
            echo "| Server | Windows x64 | \`warlay-server-v${VERSION}-x86_64-pc-windows-msvc.zip\` |"
            echo
            echo "Docker: \`docker pull ${owner}/warlay-main:${VERSION}\` (main server),"
            echo "\`docker pull ${owner}/warlay-helper:${VERSION}\` (helper) and"
            echo "\`docker pull ${owner}/warlay-server:${VERSION}\` (legacy hub)."
            echo
            echo "Verify downloads with \`SHA256SUMS.txt\`."
            echo
            echo "## Changes"
            cat CHANGES.md
          } > RELEASE_NOTES.md
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ env.VERSION }}
          name: Warlay v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          body_path: RELEASE_NOTES.md
          files: dist/*
          fail_on_unmatched_files: true
          make_latest: true
